services:
  embyserver:
    container_name: emby
    restart: always
    network_mode: bridge
    ports:
      - 8096:8096
    environment:
      # 代理指向宿主机（172.17.0.1 为 docker0 网关），无代理环境可删除下面三行
      - NO_PROXY=172.17.0.1,127.0.0.1,localhost
      - ALL_PROXY=http://172.17.0.1:7890
      - HTTPS_PROXY=http://172.17.0.1:7890
    volumes:
      - /etc/resolv.conf:/etc/resolv.conf
      - "{{docker_root}}/emby/:/config"
      # {{media_dir}} 请改为实际媒体库路径，如 /vol4/1000/media
      - "{{media_dir}}/:/media"
    image: amilys/embyserver:4.8.11.0

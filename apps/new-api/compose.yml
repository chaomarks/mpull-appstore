services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    network_mode: bridge
    ports:
      - "3003:3000"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - "{{docker_root}}/new-api/data:/data"
      - "{{docker_root}}/new-api/logs:/app/logs"
networks: {}

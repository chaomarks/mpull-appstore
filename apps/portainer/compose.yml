services:
  portainer-ce:
    restart: always
    container_name: portainer
    network_mode: bridge
    ports:
      - 9000:9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # {{docker_root}} 部署时自动替换为设置中配置的容器安装目录
      - "{{docker_root}}/portainer/:/data"
    image: 6053537/portainer-ce:latest
networks: {}

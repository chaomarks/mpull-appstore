services:
  mihomo:
    image: mark8857857/mihomo-sub:latest
    container_name: mihomo-sub
    restart: always
    network_mode: bridge
    ports:
      - "7890:7890"
      - "9090:9090"
      - "3002:3002"
    environment:
      - TZ=Asia/Shanghai
      # 三个密钥生成：CMD/SSH 终端执行 openssl rand -hex 16（32 位随机值，比手输 16 位更安全）
      - "SUB_STORE_UI_PASSWORD={{SUB_STORE_UI_PASSWORD}}"
      - "SUB_STORE_PUBLIC_TOKEN={{SUB_STORE_PUBLIC_TOKEN}}"
      - "MIHOMO_SECRET={{MIHOMO_SECRET}}"
    volumes:
      # {{docker_root}} 部署时自动替换为商店设置中配置的容器安装目录
      - "{{docker_root}}/mihomo/config:/root/.config/mihomo"
      - "{{docker_root}}/mihomo/sub-store-data:/opt/sub-store/data"
